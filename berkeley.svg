<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      .gold { fill: #FDB515; }
      .blue { fill: #003262; }
      .white { fill: #FFFFFF; }
      .serif { font-family: 'Georgia', 'Times New Roman', serif; font-weight: bold; }
      .sans { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: 0.15em; }
    </style>
  </defs>
  <!-- Beautiful Berkeley Wordmark -->
  <g transform="translate(10, 0)">
    <!-- University Seal Icon -->
    <g transform="translate(0, 15)">
      <circle cx="25" cy="25" r="23" fill="none" stroke="#FDB515" stroke-width="2.5"/>
      <circle cx="25" cy="25" r="19" fill="#003262"/>
      <!-- Book/Star graphic inside seal -->
      <path d="M17,25 C17,21 21,19 25,19 C29,19 33,21 33,25 L33,31 C29,31 25,29 25,29 C25,29 21,31 17,31 Z" fill="none" stroke="#FDB515" stroke-width="1.5"/>
      <line x1="25" y1="19" x2="25" y2="29" stroke="#FDB515" stroke-width="1.5"/>
      <polygon points="25,11 27,15 31,15 28,18 29,22 25,20 21,22 22,18 19,15 23,15" fill="#FDB515"/>
    </g>
    <!-- Text Elements -->
    <text x="65" y="32" class="serif white" font-size="28px">Berkeley</text>
    <text x="65" y="52" class="sans gold" font-size="9px">UNIVERSITY OF CALIFORNIA</text>
  </g>
</svg>
