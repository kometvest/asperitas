<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <style>
      .red { fill: #E51937; }
      .white { fill: #FFFFFF; }
      .gray { fill: #A0A0A0; }
      .bold-text { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0.2em; }
      .korean { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(10, 0)">
    <!-- Science Orbit Emblem -->
    <g transform="translate(0, 15)">
      <!-- Central nucleus -->
      <circle cx="25" cy="25" r="7" fill="#E51937"/>
      <!-- Orbits -->
      <ellipse cx="25" cy="25" rx="22" ry="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(-30, 25, 25)"/>
      <ellipse cx="25" cy="25" rx="22" ry="7" fill="none" stroke="#E51937" stroke-width="1.5" transform="rotate(30, 25, 25)"/>
      <!-- Small electrons -->
      <circle cx="9" cy="16" r="2.5" fill="#FFFFFF"/>
      <circle cx="41" cy="16" r="2.5" fill="#E51937"/>
    </g>
    <!-- Text Elements -->
    <text x="65" y="33" class="korean white" font-size="22px">동아사이언스</text>
    <text x="65" y="52" class="sub-text red" font-size="9px">DONGA SCIENCE</text>
  </g>
</svg>
